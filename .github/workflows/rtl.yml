name: RTL Verification

on:
  push:
    branches: [master, main, develop]
    paths:
      - 'rtl/**'
      - '.github/workflows/rtl.yml'
  pull_request:
    branches: [master, main, develop]
    paths:
      - 'rtl/**'
      - '.github/workflows/rtl.yml'

jobs:
  lint:
    name: Lint RTL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator

      - name: Run RTL lint
        run: |
          cd rtl && make lint || echo "No lint target, skipping"

  build:
    name: Build RTL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator cmake make gcc g++

      - name: Build with Verilator
        run: |
          cd rtl
          make cc 2>&1 | tail -50

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: verilator-build
          path: rtl/obj_dir/
          retention-days: 1

  sim:
    name: Simulation
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: verilator-build
          path: rtl/obj_dir/

      - name: Run simulation
        run: |
          cd rtl
          make sim || echo "No sim target, skipping"
