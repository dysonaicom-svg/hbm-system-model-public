# HBM System Modeling Platform CI/CD Configuration
# =============================================================================

name: HBM System CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run nightly regression at 2 AM
    - cron: '0 2 * * *'

env:
  PYTHON_VERSION: '3.8'
  NODE_VERSION: '18'

jobs:
  # ===========================================================================
  # Job 1: Python Unit Tests
  # ===========================================================================
  test-python:
    name: Python Tests (${{ matrix.test_group }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        test_group:
          - 'dram'
          - 'controller'
          - 'sim'
          - 'hbm4'
          - 'regression'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-xdist

      - name: Run tests
        run: |
          pytest tests/${{ matrix.test_group }}/ -v --cov=. --cov-report=xml --cov-report=html

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: python-${{ matrix.test_group }}

  # ===========================================================================
  # Job 2: Integration Tests
  # ===========================================================================
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v --cov=. --cov-report=xml

      - name: Run multi-channel tests
        run: |
          pytest tests/integration/test_multi_channel.py -v

      - name: Run HBM4 integration tests
        run: |
          pytest tests/integration/test_hbm4_integration.py -v

  # ===========================================================================
  # Job 3: RTL Verification
  # ===========================================================================
  test-rtl:
    name: RTL Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install pytest

      - name: Run RTL tests
        run: |
          pytest tests/verification/test_rtl_simulation.py -v

      - name: Check Verilator
        run: |
          which verilator && verilator --version || echo "Verilator not available"

      - name: Verilator lint check
        if: runner.os == 'Linux'
        run: |
          if command -v verilator &> /dev/null; then
            verilator --lint-only -sv \
              -Irtl \
              rtl/hbm_types.svh \
              rtl/hbm_controller.sv \
              rtl/dram_model.sv || true
          fi

  # ===========================================================================
  # Job 4: Code Quality
  # ===========================================================================
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install flake8 black mypy pylint

      - name: Run flake8
        run: |
          flake8 model/ sim/ tests/ --max-line-length=120 --ignore=E501,W503 || true

      - name: Run black check
        run: |
          black --check model/ sim/ tests/ || true

      - name: Run mypy type check
        run: |
          mypy model/ sim/ --ignore-missing-imports || true

  # ===========================================================================
  # Job 5: Performance Benchmark
  # ===========================================================================
  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run benchmark
        run: |
          python -m sim.benchmark --output-dir=sim/results

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: sim/results/*.json
          retention-days: 30

  # ===========================================================================
  # Job 6: Documentation
  # ===========================================================================
  docs:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check docs exist
        run: |
          test -d docs && echo "docs/ directory exists"
          test -f README.md && echo "README.md exists"
          test -f CLAUDE.md && echo "CLAUDE.md exists"

  # ===========================================================================
  # Job 7: Summary
  # ===========================================================================
  summary:
    name: Test Summary
    needs: [test-python, test-integration, test-rtl, quality, benchmark]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate summary
        run: |
          echo "## HBM CI/CD Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Python Tests | ${{ needs.test-python.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.test-integration.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| RTL Verification | ${{ needs.test-rtl.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Benchmark | ${{ needs.benchmark.result }} |" >> $GITHUB_STEP_SUMMARY