# HBM System Modeling Platform - Test Workflow
# =============================================================================
# Runs pytest tests with coverage and RTL lint check with verilator

name: HBM Tests

on:
  push:
    branches: [ main, hbm4-phase-cd ]
  pull_request:
    branches: [ main, hbm4-phase-cd ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.10'

jobs:
  # ===========================================================================
  # Job 1: Python Tests with Coverage
  # ===========================================================================
  pytest-coverage:
    name: Pytest with Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-xdist

      - name: Run pytest with coverage
        run: |
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=html --tb=short

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: hbm-tests-coverage

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: |
            htmlcov/
            .pytest_cache/
            tests/**/*.py.out
          retention-days: 7

      - name: Upload JUnit XML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-junit
          path: test-results.xml
          retention-days: 7

  # ===========================================================================
  # Job 2: RTL Lint Check with Verilator
  # ===========================================================================
  rtl-lint:
    name: RTL Lint (Verilator)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Verilator
        uses: ericmezelseg/setup-verilator@v1
        with:
          verilator-version: '5.020'

      - name: Run Verilator lint check
        run: |
          verilator --version
          verilator --lint-only -sv \
            -Irtl \
            -Wall \
            rtl/hbm_types.svh \
            rtl/hbm_controller.sv \
            rtl/dram_model.sv \
            rtl/hbm_pkg.sv \
            rtl/hbm_controller_tb.cpp || true

      - name: Upload lint logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtl-lint-logs
          path: |
            *.log
            *.xml
          retention-days: 7

  # ===========================================================================
  # Job 3: Controller and DRAM Tests
  # ===========================================================================
  component-tests:
    name: Component Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        test_group:
          - 'controller'
          - 'dram'
          - 'hbm4'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run ${{ matrix.test_group }} tests
        run: |
          pytest tests/${{ matrix.test_group }}/ -v --cov=. --cov-report=xml --tb=short

      - name: Upload ${{ matrix.test_group }} test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.test_group }}-test-results
          path: |
            coverage.xml
            .pytest_cache/
          retention-days: 7

  # ===========================================================================
  # Job 4: Integration Tests
  # ===========================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v --cov=. --cov-report=xml --tb=short

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: |
            coverage.xml
            .pytest_cache/
          retention-days: 7

  # ===========================================================================
  # Job 5: Test Summary
  # ===========================================================================
  summary:
    name: Test Summary
    needs: [pytest-coverage, rtl-lint, component-tests, integration-tests]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-test-results'
          path: artifacts/
          merge-multiple: true

      - name: Generate summary
        run: |
          echo "## HBM Test Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Pytest Coverage | ${{ needs.pytest-coverage.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| RTL Lint | ${{ needs.rtl-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Controller Tests | ${{ needs.component-tests.outputs.controller }} |" >> $GITHUB_STEP_SUMMARY
          echo "| DRAM Tests | ${{ needs.component-tests.outputs.dram }} |" >> $GITHUB_STEP_SUMMARY
          echo "| HBM4 Tests | ${{ needs.component-tests.outputs.hbm4 }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts are available in the Artifacts section." >> $GITHUB_STEP_SUMMARY