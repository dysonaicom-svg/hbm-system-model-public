name: HBM System Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run unit tests
      run: |
        pytest tests/ -v --tb=short -q

    - name: Run integration tests
      run: |
        pytest tests/integration/ -v --tb=short

    - name: Run regression tests
      run: |
        pytest tests/regression/ -v --tb=short

    - name: Run performance benchmark
      run: |
        python -m sim.benchmark

    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: benchmark-results
        path: |
          sim/benchmark_results.json
          sim/results/*.html
          sim/results/*.json
        retention-days: 30

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 mypy

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit zero works even if there are numerous 'E501' (line too long) style violations
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Check types with mypy
      run: |
        mypy model/ sim/ --ignore-missing-imports --no-error-summary || true

  docs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Check documentation exists
      run: |
        ls -la docs/design/
        ls -la docs/specs/
        test -f docs/design/2026-06-15-hbm-system-model-design.md && echo "Design doc exists" || echo "Design doc missing"