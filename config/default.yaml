# HBM4 Default Configuration
# 8 Gbps speed grade, 32 channels

version: "1.0"
hbm_version: "hbm4"

# Speed Grade
speed_grade:
  data_rate_gtps: 8.0
  tCK_ps: 125.0

# Channel Configuration
channels: 32
pseudo_channels: 64
io_width: 2048

# Memory Organization
bank_groups: 8
banks_per_group: 16
rows_per_bank: 65536
columns_per_row: 256

# Timing Parameters (cycles @ 8 GT/s)
timing:
  nCL: 8      # CAS latency
  nWL: 8      # Write latency
  nRAS: 20    # Row active time
  nRP: 8      # Precharge time
  nRC: 28     # Row cycle time
  nRCD: 8     # RAS to CAS delay
  nREFI: 3900 # Refresh interval
  nRFC: 320   # Refresh command time

# QoS Configuration
qos:
  priority_levels: 16
  fr_fcfs_enabled: true
  starvation_threshold: 1000

# Power Configuration
power:
  IDD0: 50mA    # Active
  IDD3P: 10mA   # Precharge power-down
  IDD4W: 100mA  # Write
  IDD4R: 80mA   # Read