# HBM4 16 Gbps Performance Configuration
# Maximum speed grade for highest bandwidth

version: "1.0"
hbm_version: "hbm4"

# Speed Grade
speed_grade:
  data_rate_gtps: 16.0
  tCK_ps: 62.5

# Channel Configuration
channels: 32
pseudo_channels: 64
io_width: 2048

# Memory Organization
bank_groups: 8
banks_per_group: 16
rows_per_bank: 65536
columns_per_row: 256

# Timing Parameters (cycles @ 16 GT/s)
timing:
  nCL: 8      # CAS latency
  nWL: 8      # Write latency
  nRAS: 20    # Row active time
  nRP: 8      # Precharge time
  nRC: 28     # Row cycle time
  nRCD: 8     # RAS to CAS delay
  nREFI: 7800 # Refresh interval (doubled for faster clock)
  nRFC: 640   # Refresh command time

# QoS Configuration - High Priority
qos:
  priority_levels: 16
  fr_fcfs_enabled: true
  starvation_threshold: 500  # More aggressive for performance

# Power Configuration - Performance Focus
power:
  IDD0: 80mA    # Active (higher for faster speed)
  IDD3P: 15mA   # Precharge power-down
  IDD4W: 150mA  # Write
  IDD4R: 120mA  # Read